<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">

  <!-- MEWZIK carousel · slide 03 / 05 · product description -->

  <defs>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EE7DF"/><stop offset="1" stop-color="#6C5CE7"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB86B"/><stop offset="1" stop-color="#FF6BCB"/>
    </linearGradient>
    <linearGradient id="blend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EE7DF"/><stop offset=".38" stop-color="#6C5CE7"/>
      <stop offset=".68" stop-color="#FF6BCB"/><stop offset="1" stop-color="#FFB86B"/>
    </linearGradient>
    <radialGradient id="hazeCool"><stop offset="0" stop-color="#5EE7DF" stop-opacity=".16"/><stop offset="1" stop-color="#5EE7DF" stop-opacity="0"/></radialGradient>
    <radialGradient id="hazeWarm"><stop offset="0" stop-color="#FF8A65" stop-opacity=".16"/><stop offset="1" stop-color="#FF8A65" stop-opacity="0"/></radialGradient>
    <path id="spark" d="M0 -7 L1.8 -1.8 L7 0 L1.8 1.8 L0 7 L-1.8 1.8 L-7 0 L-1.8 -1.8 Z"/>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" opacity=".045"/>
    </pattern>
  </defs>

  <!-- frame -->
  <rect width="1600" height="800" fill="#0B0B10"/>
  <ellipse cx="220"  cy="170" rx="420" ry="280" fill="url(#hazeCool)"/>
  <ellipse cx="1380" cy="170" rx="420" ry="280" fill="url(#hazeWarm)"/>
  <ellipse cx="220"  cy="650" rx="380" ry="240" fill="url(#hazeCool)" opacity=".6"/>
  <ellipse cx="1380" cy="650" rx="380" ry="240" fill="url(#hazeWarm)" opacity=".6"/>
  <rect x="60" y="48" width="1480" height="704" fill="url(#dots)"/>
  <text x="60"   y="36" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#8A8AA0">MEWZIK &#169; 2026</text>
  <text x="800"  y="36" text-anchor="middle" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#5A5A6E">03 / 05</text>
  <text x="1540" y="36" text-anchor="end" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#8A8AA0">DISCORD MUSIC BOT</text>
  <line x1="60" y1="48" x2="1540" y2="48" stroke="#FFFFFF" stroke-opacity=".12"/>

  <!-- header -->
  <text x="800" y="108" text-anchor="middle" font-family="Consolas, monospace" font-size="12" letter-spacing="4" fill="#5EE7DF">[ PRODUCT ]</text>
  <text x="800" y="156" text-anchor="middle" font-size="38" font-weight="700" fill="#F5F4F8">what is mewzik?</text>

  <!-- left: description -->
  <g font-size="15" fill="#C9C9D6">
    <text x="100" y="230">mewzik is a premium discord music bot built</text>
    <text x="100" y="258">for servers that take their sound seriously.</text>
    <text x="100" y="306">it streams from five platforms, ships a live</text>
    <text x="100" y="334">interactive player with every track, and can</text>
    <text x="100" y="362">stay in your voice channel 24/7 &#8212; with smart</text>
    <text x="100" y="390">autoplay that stops when the room empties.</text>
  </g>

  <!-- platform chips -->
  <g font-size="12" fill="#E5E1F2">
    <rect x="100" y="430" width="92"  height="30" rx="15" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".12"/>
    <circle cx="117" cy="445" r="4" fill="#1DB954"/><text x="127" y="449">Spotify</text>
    <rect x="204" y="430" width="92"  height="30" rx="15" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".12"/>
    <circle cx="221" cy="445" r="4" fill="#FF3333"/><text x="231" y="449">YouTube</text>
    <rect x="308" y="430" width="110" height="30" rx="15" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".12"/>
    <circle cx="325" cy="445" r="4" fill="#FA57C1"/><text x="335" y="449">Apple Music</text>
    <rect x="430" y="430" width="84"  height="30" rx="15" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".12"/>
    <circle cx="447" cy="445" r="4" fill="#A238FF"/><text x="457" y="449">Deezer</text>
    <rect x="526" y="430" width="110" height="30" rx="15" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".12"/>
    <circle cx="543" cy="445" r="4" fill="#FF5500"/><text x="553" y="449">SoundCloud</text>
  </g>

  <!-- stat mini-band -->
  <line x1="100" y1="520" x2="700" y2="520" stroke="#FFFFFF" stroke-opacity=".1"/>
  <line x1="100" y1="624" x2="700" y2="624" stroke="#FFFFFF" stroke-opacity=".1"/>
  <g stroke="#2A2A36">
    <line x1="254" y1="540" x2="254" y2="604"/>
    <line x1="409" y1="540" x2="409" y2="604"/>
    <line x1="564" y1="540" x2="564" y2="604"/>
  </g>
  <g text-anchor="middle">
    <text x="177" y="578" font-size="26" font-weight="800" fill="url(#blend)">56</text>
    <text x="177" y="602" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#8A8AA0">COMMANDS</text>
    <text x="332" y="578" font-size="26" font-weight="800" fill="url(#cool)">5</text>
    <text x="332" y="602" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#8A8AA0">PLATFORMS</text>
    <text x="487" y="578" font-size="26" font-weight="800" fill="url(#warm)">7</text>
    <text x="487" y="602" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#8A8AA0">FILTERS</text>
    <text x="642" y="578" font-size="26" font-weight="800" fill="url(#blend)">100</text>
    <text x="642" y="602" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#8A8AA0">TRACK QUEUE</text>
  </g>
  <text x="100" y="680" font-family="Consolas, monospace" font-size="11" fill="#8A8AA0">slash or custom prefix &#183; short aliases included (/p, /q, /lb &#8230;)</text>

  <!-- right: player mockup -->
  <g>
    <rect x="860" y="210" width="660" height="380" rx="28" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".1"/>
    <circle cx="950" cy="320" r="50" fill="url(#blend)"/>
    <circle cx="950" cy="320" r="30" fill="none" stroke="#FFFFFF" stroke-opacity=".25"/>
    <circle cx="950" cy="320" r="9"  fill="#0B0B10"/>
    <text x="1030" y="290" font-family="Consolas, monospace" font-size="10" letter-spacing="3" fill="#5EE7DF">NOW PLAYING</text>
    <text x="1030" y="324" font-size="21" font-weight="600" fill="#F5F4F8">midnight frequencies &#8212; aurora lane</text>
    <text x="1030" y="350" font-family="Consolas, monospace" font-size="11" fill="#8A8AA0">02:21 / 03:56 &#183; spotify &#183; filter: 8d</text>
    <g fill="url(#blend)" opacity=".6">
      <rect x="900"  y="416" width="5" height="18" rx="2.5"/>
      <rect x="928"  y="408" width="5" height="34" rx="2.5"/>
      <rect x="956"  y="400" width="5" height="50" rx="2.5"/>
      <rect x="984"  y="412" width="5" height="26" rx="2.5"/>
      <rect x="1012" y="404" width="5" height="42" rx="2.5"/>
      <rect x="1040" y="414" width="5" height="22" rx="2.5"/>
      <rect x="1068" y="398" width="5" height="54" rx="2.5"/>
      <rect x="1096" y="406" width="5" height="38" rx="2.5"/>
      <rect x="1124" y="416" width="5" height="18" rx="2.5"/>
      <rect x="1152" y="408" width="5" height="34" rx="2.5"/>
      <rect x="1180" y="402" width="5" height="46" rx="2.5"/>
      <rect x="1208" y="413" width="5" height="24" rx="2.5"/>
    </g>
    <g fill="#2A2A36">
      <rect x="1236" y="409" width="5" height="32" rx="2.5"/>
      <rect x="1264" y="404" width="5" height="42" rx="2.5"/>
      <rect x="1292" y="414" width="5" height="22" rx="2.5"/>
      <rect x="1320" y="407" width="5" height="36" rx="2.5"/>
      <rect x="1348" y="412" width="5" height="26" rx="2.5"/>
      <rect x="1376" y="405" width="5" height="40" rx="2.5"/>
      <rect x="1404" y="415" width="5" height="20" rx="2.5"/>
      <rect x="1432" y="409" width="5" height="32" rx="2.5"/>
      <rect x="1460" y="413" width="5" height="24" rx="2.5"/>
    </g>
    <line x1="900" y1="480" x2="1480" y2="480" stroke="#2A2A36" stroke-width="4" stroke-linecap="round"/>
    <line x1="900" y1="480" x2="1248" y2="480" stroke="url(#blend)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="1248" cy="480" r="6" fill="#FFFFFF"/>
    <text x="900"  y="506" font-family="Consolas, monospace" font-size="11" fill="#8A8AA0">02:21</text>
    <text x="1480" y="506" text-anchor="end" font-family="Consolas, monospace" font-size="11" fill="#8A8AA0">03:56</text>
    <circle cx="1130" cy="548" r="16" fill="none" stroke="#FFFFFF" stroke-opacity=".2"/>
    <path d="M1136 541v14l-10-7zM1125 541.5v13" stroke="#C9C9D6" stroke-width="1.6" fill="#C9C9D6" stroke-linecap="round"/>
    <circle cx="1190" cy="548" r="22" fill="url(#blend)"/>
    <path d="M1184 539v18l14-9z" fill="#0B0B10"/>
    <circle cx="1250" cy="548" r="16" fill="none" stroke="#FFFFFF" stroke-opacity=".2"/>
    <path d="M1244 541v14l10-7zM1255 541.5v13" stroke="#C9C9D6" stroke-width="1.6" fill="#C9C9D6" stroke-linecap="round"/>
  </g>
  <text x="1190" y="640" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#8A8AA0">live buttons on every track &#8212; no commands needed</text>
  <use href="#spark" transform="translate(880,660) scale(.6)" fill="#5EE7DF"/>
  <use href="#spark" transform="translate(1500,660) scale(.6)" fill="#FFB86B"/>

  <!-- footer -->
  <line x1="60" y1="752" x2="1540" y2="752" stroke="#FFFFFF" stroke-opacity=".12"/>
  <text x="60" y="776" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#8A8AA0">MEWZIK &#169; 2026</text>
  <circle cx="706" cy="772" r="3" fill="#5EE7DF"/>
  <text x="800" y="776" text-anchor="middle" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#8A8AA0">ONLINE &#8212; ALL SYSTEMS GO</text>
  <text x="1540" y="776" text-anchor="end" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#8A8AA0">MADE FOR DISCORD</text>
  <rect x="0" y="794" width="1600" height="6" fill="url(#blend)"/>
</svg>
