<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">

  <!-- MEWZIK carousel · slide 05 / 05 · command deck + CTA -->

  <defs>
    <linearGradient id="blend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EE7DF"/><stop offset=".38" stop-color="#6C5CE7"/>
      <stop offset=".68" stop-color="#FF6BCB"/><stop offset="1" stop-color="#FFB86B"/>
    </linearGradient>
    <radialGradient id="hazeCool"><stop offset="0" stop-color="#5EE7DF" stop-opacity=".16"/><stop offset="1" stop-color="#5EE7DF" stop-opacity="0"/></radialGradient>
    <radialGradient id="hazeWarm"><stop offset="0" stop-color="#FF8A65" stop-opacity=".16"/><stop offset="1" stop-color="#FF8A65" stop-opacity="0"/></radialGradient>
    <path id="spark" d="M0 -7 L1.8 -1.8 L7 0 L1.8 1.8 L0 7 L-1.8 1.8 L-7 0 L-1.8 -1.8 Z"/>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" opacity=".045"/>
    </pattern>
  </defs>

  <!-- frame -->
  <rect width="1600" height="800" fill="#0B0B10"/>
  <ellipse cx="220"  cy="170" rx="420" ry="280" fill="url(#hazeCool)"/>
  <ellipse cx="1380" cy="170" rx="420" ry="280" fill="url(#hazeWarm)"/>
  <ellipse cx="220"  cy="650" rx="380" ry="240" fill="url(#hazeCool)" opacity=".6"/>
  <ellipse cx="1380" cy="650" rx="380" ry="240" fill="url(#hazeWarm)" opacity=".6"/>
  <rect x="60" y="48" width="1480" height="704" fill="url(#dots)"/>
  <text x="60"   y="36" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#8A8AA0">MEWZIK &#169; 2026</text>
  <text x="800"  y="36" text-anchor="middle" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#5A5A6E">05 / 05</text>
  <text x="1540" y="36" text-anchor="end" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#8A8AA0">DISCORD MUSIC BOT</text>
  <line x1="60" y1="48" x2="1540" y2="48" stroke="#FFFFFF" stroke-opacity=".12"/>

  <!-- header -->
  <text x="800" y="108" text-anchor="middle" font-family="Consolas, monospace" font-size="12" letter-spacing="4" fill="#FFB86B">[ COMMANDS ]</text>
  <text x="800" y="156" text-anchor="middle" font-size="38" font-weight="700" fill="#F5F4F8">the command deck</text>
  <text x="800" y="186" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#8A8AA0">slash or custom prefix &#183; short aliases included (/p, /q, /lb, /dc &#8230;)</text>

  <!-- public panel -->
  <g>
    <rect x="60" y="210" width="1000" height="480" rx="22" fill="#FFFFFF" fill-opacity=".03" stroke="#FFFFFF" stroke-opacity=".1"/>
    <circle cx="92" cy="242" r="5" fill="#5EE7DF"/>
    <text x="106" y="246" font-size="14" font-weight="700" letter-spacing="2" fill="#F5F4F8">FOR EVERYONE &#8212; 42 COMMANDS</text>

    <text x="84" y="286" font-family="Consolas, monospace" font-size="9.5" letter-spacing="3" fill="#8A8AA0">PLAYBACK</text>
    <g font-family="Consolas, monospace" font-size="10.5" fill="#C9C9D6">
      <rect x="84"  y="298" width="50" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="93"  y="314">/play</text>
      <rect x="142" y="298" width="56" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="151" y="314">/pause</text>
      <rect x="206" y="298" width="62" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="215" y="314">/resume</text>
      <rect x="276" y="298" width="50" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="285" y="314">/stop</text>
      <rect x="334" y="298" width="50" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="343" y="314">/skip</text>
      <rect x="392" y="298" width="75" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="401" y="314">/previous</text>
      <rect x="475" y="298" width="62" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="484" y="314">/replay</text>
      <rect x="545" y="298" width="50" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="554" y="314">/seek</text>
      <rect x="603" y="298" width="62" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="612" y="314">/volume</text>
      <rect x="673" y="298" width="50" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="682" y="314">/loop</text>
      <rect x="731" y="298" width="81" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="740" y="314">/loopqueue</text>
      <rect x="820" y="298" width="68" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="829" y="314">/shuffle</text>
    </g>

    <text x="84" y="374" font-family="Consolas, monospace" font-size="9.5" letter-spacing="3" fill="#8A8AA0">QUEUE &amp; SESSION</text>
    <g font-family="Consolas, monospace" font-size="10.5" fill="#C9C9D6">
      <rect x="84"  y="386" width="56" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="93"  y="402">/queue</text>
      <rect x="148" y="386" width="87" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="157" y="402">/clearqueue</text>
      <rect x="243" y="386" width="50" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="252" y="402">/move</text>
      <rect x="301" y="386" width="62" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="310" y="402">/remove</text>
      <rect x="371" y="386" width="87" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="380" y="402">/nowplaying</text>
      <rect x="466" y="386" width="68" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="475" y="402">/history</text>
      <rect x="542" y="386" width="62" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="551" y="402">/lyrics</text>
      <rect x="612" y="386" width="62" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="621" y="402">/search</text>
      <rect x="682" y="386" width="75" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="691" y="402">/autoplay</text>
      <rect x="765" y="386" width="68" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="774" y="402">/session</text>
    </g>

    <text x="84" y="462" font-family="Consolas, monospace" font-size="9.5" letter-spacing="3" fill="#8A8AA0">STUDIO FILTERS</text>
    <g font-family="Consolas, monospace" font-size="10.5" fill="#C9C9D6">
      <rect x="84"  y="474" width="81" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="93"  y="490">/bassboost</text>
      <rect x="173" y="474" width="81" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="182" y="490">/nightcore</text>
      <rect x="262" y="474" width="81" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="271" y="490">/vaporwave</text>
      <rect x="351" y="474" width="68" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="360" y="490">/karaoke</text>
      <rect x="427" y="474" width="37" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="436" y="490">/8d</text>
      <rect x="472" y="474" width="75" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="481" y="490">/chipmunk</text>
      <rect x="555" y="474" width="81" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="564" y="490">/deepvoice</text>
      <rect x="644" y="474" width="56" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="653" y="490">/reset</text>
    </g>

    <text x="84" y="550" font-family="Consolas, monospace" font-size="9.5" letter-spacing="3" fill="#8A8AA0">LIBRARY &amp; SOCIAL</text>
    <g font-family="Consolas, monospace" font-size="10.5" fill="#C9C9D6">
      <rect x="84"  y="562" width="75"  height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="93"  y="578">/playlist</text>
      <rect x="167" y="562" width="75"  height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="176" y="578">/favorite</text>
      <rect x="250" y="562" width="100" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="259" y="578">/savefavorite</text>
      <rect x="358" y="562" width="68"  height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="367" y="578">/profile</text>
      <rect x="434" y="562" width="94"  height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="443" y="578">/leaderboard</text>
      <rect x="536" y="562" width="75"  height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="545" y="578">/dedicate</text>
    </g>

    <text x="84" y="638" font-family="Consolas, monospace" font-size="9.5" letter-spacing="3" fill="#8A8AA0">UTILITY</text>
    <g font-family="Consolas, monospace" font-size="10.5" fill="#C9C9D6">
      <rect x="84"  y="650" width="50" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="93"  y="666">/join</text>
      <rect x="142" y="650" width="87" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="151" y="666">/disconnect</text>
      <rect x="237" y="650" width="50" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="246" y="666">/ping</text>
      <rect x="295" y="650" width="56" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="304" y="666">/stats</text>
      <rect x="359" y="650" width="62" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="368" y="666">/engine</text>
      <rect x="429" y="650" width="50" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#5EE7DF" stroke-opacity=".35"/><text x="438" y="666">/help</text>
    </g>
