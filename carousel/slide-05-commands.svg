  <!-- admin panel + CTA -->
  <g>
    <rect x="1084" y="210" width="456" height="480" rx="22" fill="#FFFFFF" fill-opacity=".03" stroke="#FFFFFF" stroke-opacity=".1"/>
    <circle cx="1116" cy="242" r="5" fill="#FFB86B"/>
    <text x="1130" y="246" font-size="14" font-weight="700" letter-spacing="2" fill="#F5F4F8">FOR ADMINS &#8212; 14</text>

    <text x="1108" y="286" font-family="Consolas, monospace" font-size="9.5" letter-spacing="3" fill="#8A8AA0">CHANNEL SETUP &amp; 24/7</text>
    <g font-family="Consolas, monospace" font-size="10.5" fill="#C9C9D6">
      <rect x="1108" y="298" width="56" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#FFB86B" stroke-opacity=".35"/><text x="1117" y="314">/setup</text>
      <rect x="1172" y="298" width="87" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#FFB86B" stroke-opacity=".35"/><text x="1181" y="314">/clearsetup</text>
      <rect x="1267" y="298" width="75" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#FFB86B" stroke-opacity=".35"/><text x="1276" y="314">/getsetup</text>
      <rect x="1108" y="332" width="87"  height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#FFB86B" stroke-opacity=".35"/><text x="1117" y="348">/temp-setup</text>
      <rect x="1203" y="332" width="119" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#FFB86B" stroke-opacity=".35"/><text x="1212" y="348">/clear-tempsetup</text>
      <rect x="1330" y="332" width="106" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#FFB86B" stroke-opacity=".35"/><text x="1339" y="348">/get-tempsetup</text>
    </g>

    <text x="1108" y="398" font-family="Consolas, monospace" font-size="9.5" letter-spacing="3" fill="#8A8AA0">DJ &amp; PLAYER CONTROL</text>
    <g font-family="Consolas, monospace" font-size="10.5" fill="#C9C9D6">
      <rect x="1108" y="410" width="37" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#FFB86B" stroke-opacity=".35"/><text x="1117" y="426">/dj</text>
      <rect x="1153" y="410" width="56" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#FFB86B" stroke-opacity=".35"/><text x="1162" y="426">/setdj</text>
      <rect x="1217" y="410" width="68" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#FFB86B" stroke-opacity=".35"/><text x="1226" y="426">/cleardj</text>
      <rect x="1293" y="410" width="62" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#FFB86B" stroke-opacity=".35"/><text x="1302" y="426">/djlock</text>
      <rect x="1108" y="444" width="75" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#FFB86B" stroke-opacity=".35"/><text x="1117" y="460">/djunlock</text>
      <rect x="1191" y="444" width="62" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#FFB86B" stroke-opacity=".35"/><text x="1200" y="460">/button</text>
      <rect x="1261" y="444" width="43" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#FFB86B" stroke-opacity=".35"/><text x="1270" y="460">/fix</text>
      <rect x="1312" y="444" width="81" height="24" rx="12" fill="#FFFFFF" fill-opacity=".03" stroke="#FFB86B" stroke-opacity=".35"/><text x="1321" y="460">/adminhelp</text>
    </g>

    <!-- CTA -->
    <line x1="1108" y1="510" x2="1516" y2="510" stroke="#FFFFFF" stroke-opacity=".08"/>
    <ellipse cx="1312" cy="582" rx="160" ry="40" fill="none" stroke="url(#blend)" stroke-opacity=".2"/>
    <use href="#spark" transform="translate(1150,582) scale(.7)" fill="#5EE7DF"/>
    <use href="#spark" transform="translate(1474,582) scale(.7)" fill="#FFB86B"/>
    <rect x="1212" y="560" width="200" height="44" rx="22" fill="url(#blend)"/>
    <text x="1312" y="587" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#0B0B10">GET MEWZIK &#8594;</text>
    <text x="1312" y="640" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#8A8AA0">premium sound, zero friction.</text>
    <text x="1312" y="662" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#8A8AA0">press play.</text>
  </g>

  <!-- footer -->
  <line x1="60" y1="752" x2="1540" y2="752" stroke="#FFFFFF" stroke-opacity=".12"/>
  <text x="60" y="776" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#8A8AA0">MEWZIK &#169; 2026</text>
  <circle cx="706" cy="772" r="3" fill="#5EE7DF"/>
  <text x="800" y="776" text-anchor="middle" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#8A8AA0">ONLINE &#8212; ALL SYSTEMS GO</text>
  <text x="1540" y="776" text-anchor="end" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#8A8AA0">MADE FOR DISCORD</text>
  <rect x="0" y="794" width="1600" height="6" fill="url(#blend)"/>
</svg>
