<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">

  <!-- MEWZIK carousel · slide 02 / 05 · features -->

  <defs>
    <linearGradient id="blend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EE7DF"/><stop offset=".38" stop-color="#6C5CE7"/>
      <stop offset=".68" stop-color="#FF6BCB"/><stop offset="1" stop-color="#FFB86B"/>
    </linearGradient>
    <radialGradient id="hazeCool"><stop offset="0" stop-color="#5EE7DF" stop-opacity=".16"/><stop offset="1" stop-color="#5EE7DF" stop-opacity="0"/></radialGradient>
    <radialGradient id="hazeWarm"><stop offset="0" stop-color="#FF8A65" stop-opacity=".16"/><stop offset="1" stop-color="#FF8A65" stop-opacity="0"/></radialGradient>
    <path id="spark" d="M0 -7 L1.8 -1.8 L7 0 L1.8 1.8 L0 7 L-1.8 1.8 L-7 0 L-1.8 -1.8 Z"/>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" opacity=".045"/>
    </pattern>
  </defs>

  <!-- frame -->
  <rect width="1600" height="800" fill="#0B0B10"/>
  <ellipse cx="220"  cy="170" rx="420" ry="280" fill="url(#hazeCool)"/>
  <ellipse cx="1380" cy="170" rx="420" ry="280" fill="url(#hazeWarm)"/>
  <ellipse cx="220"  cy="650" rx="380" ry="240" fill="url(#hazeCool)" opacity=".6"/>
  <ellipse cx="1380" cy="650" rx="380" ry="240" fill="url(#hazeWarm)" opacity=".6"/>
  <rect x="60" y="48" width="1480" height="704" fill="url(#dots)"/>
  <text x="60"   y="36" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#8A8AA0">MEWZIK &#169; 2026</text>
  <text x="800"  y="36" text-anchor="middle" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#5A5A6E">02 / 05</text>
  <text x="1540" y="36" text-anchor="end" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#8A8AA0">DISCORD MUSIC BOT</text>
  <line x1="60" y1="48" x2="1540" y2="48" stroke="#FFFFFF" stroke-opacity=".12"/>

  <!-- header -->
  <text x="800" y="108" text-anchor="middle" font-family="Consolas, monospace" font-size="12" letter-spacing="4" fill="#FFB86B">[ FEATURES ]</text>
  <text x="800" y="156" text-anchor="middle" font-size="38" font-weight="700" fill="#F5F4F8">everything it does</text>
  <use href="#spark" transform="translate(560,140) scale(.7)" fill="#5EE7DF"/>
  <use href="#spark" transform="translate(1040,140) scale(.7)" fill="#FFB86B"/>

  <!-- row 1 -->
  <g transform="translate(68,210)">
    <rect width="348" height="200" rx="20" fill="#FFFFFF" fill-opacity=".03" stroke="#FFFFFF" stroke-opacity=".1"/>
    <circle cx="30" cy="42" r="4.5" fill="#5EE7DF"/>
    <text x="320" y="32" text-anchor="end" font-family="Consolas, monospace" font-size="10" fill="#5A5A6E">01</text>
    <text x="48" y="48" font-size="17" font-weight="700" fill="#F5F4F8">smart autoplay</text>
    <text x="30" y="88"  font-size="12.5" fill="#8A8AA0">queue refills itself, stops when</text>
    <text x="30" y="110" font-size="12.5" fill="#8A8AA0">the room empties</text>
    <text x="320" y="176" text-anchor="end" font-family="Consolas, monospace" font-size="10" fill="#5EE7DF" fill-opacity=".85">/autoplay</text>
  </g>
  <g transform="translate(440,210)">
    <rect width="348" height="200" rx="20" fill="#FFFFFF" fill-opacity=".03" stroke="#FFFFFF" stroke-opacity=".1"/>
    <circle cx="30" cy="42" r="4.5" fill="#FFB86B"/>
    <text x="320" y="32" text-anchor="end" font-family="Consolas, monospace" font-size="10" fill="#5A5A6E">02</text>
    <text x="48" y="48" font-size="17" font-weight="700" fill="#F5F4F8">live lyrics</text>
    <text x="30" y="88"  font-size="12.5" fill="#8A8AA0">on-demand, fuzzy-matched,</text>
    <text x="30" y="110" font-size="12.5" fill="#8A8AA0">romanized</text>
    <text x="320" y="176" text-anchor="end" font-family="Consolas, monospace" font-size="10" fill="#FFB86B" fill-opacity=".85">/lyrics</text>
  </g>
  <g transform="translate(812,210)">
    <rect width="348" height="200" rx="20" fill="#FFFFFF" fill-opacity=".03" stroke="#FFFFFF" stroke-opacity=".1"/>
    <circle cx="30" cy="42" r="4.5" fill="#FFB86B"/>
    <text x="320" y="32" text-anchor="end" font-family="Consolas, monospace" font-size="10" fill="#5A5A6E">03</text>
    <text x="48" y="48" font-size="17" font-weight="700" fill="#F5F4F8">pick-your-version search</text>
    <text x="30" y="88"  font-size="12.5" fill="#8A8AA0">choose the exact upload</text>
    <text x="30" y="110" font-size="12.5" fill="#8A8AA0">from a clean menu</text>
    <text x="320" y="176" text-anchor="end" font-family="Consolas, monospace" font-size="10" fill="#FFB86B" fill-opacity=".85">/search</text>
  </g>
  <g transform="translate(1184,210)">
    <rect width="348" height="200" rx="20" fill="#FFFFFF" fill-opacity=".03" stroke="#FFFFFF" stroke-opacity=".1"/>
    <circle cx="30" cy="42" r="4.5" fill="#5EE7DF"/>
    <text x="320" y="32" text-anchor="end" font-family="Consolas, monospace" font-size="10" fill="#5A5A6E">04</text>
    <text x="48" y="48" font-size="17" font-weight="700" fill="#F5F4F8">playlists + favorites</text>
    <text x="30" y="88"  font-size="12.5" fill="#8A8AA0">your library follows you</text>
    <text x="30" y="110" font-size="12.5" fill="#8A8AA0">across servers</text>
    <text x="320" y="176" text-anchor="end" font-family="Consolas, monospace" font-size="10" fill="#5EE7DF" fill-opacity=".85">/playlist &#183; /favorite</text>
  </g>
  <!-- row 2 -->
  <g transform="translate(68,434)">
    <rect width="348" height="200" rx="20" fill="#FFFFFF" fill-opacity=".03" stroke="#FFFFFF" stroke-opacity=".1"/>
    <circle cx="30" cy="42" r="4.5" fill="#FFB86B"/>
    <text x="320" y="32" text-anchor="end" font-family="Consolas, monospace" font-size="10" fill="#5A5A6E">05</text>
    <text x="48" y="48" font-size="17" font-weight="700" fill="#F5F4F8">profile + leaderboard</text>
    <text x="30" y="88"  font-size="12.5" fill="#8A8AA0">rendered cards, real</text>
    <text x="30" y="110" font-size="12.5" fill="#8A8AA0">listening-time ranks</text>
    <text x="320" y="176" text-anchor="end" font-family="Consolas, monospace" font-size="10" fill="#FFB86B" fill-opacity=".85">/profile &#183; /leaderboard</text>
  </g>
  <g transform="translate(440,434)">
    <rect width="348" height="200" rx="20" fill="#FFFFFF" fill-opacity=".03" stroke="#FFFFFF" stroke-opacity=".1"/>
    <circle cx="30" cy="42" r="4.5" fill="#5EE7DF"/>
    <text x="320" y="32" text-anchor="end" font-family="Consolas, monospace" font-size="10" fill="#5A5A6E">06</text>
    <text x="48" y="48" font-size="17" font-weight="700" fill="#F5F4F8">dj mode + session lock</text>
    <text x="30" y="88"  font-size="12.5" fill="#8A8AA0">hand over the decks without</text>
    <text x="30" y="110" font-size="12.5" fill="#8A8AA0">losing control</text>
    <text x="320" y="176" text-anchor="end" font-family="Consolas, monospace" font-size="10" fill="#5EE7DF" fill-opacity=".85">/dj &#183; /session</text>
  </g>
  <g transform="translate(812,434)">
    <rect width="348" height="200" rx="20" fill="#FFFFFF" fill-opacity=".03" stroke="#FFFFFF" stroke-opacity=".1"/>
    <circle cx="30" cy="42" r="4.5" fill="#5EE7DF"/>
    <text x="320" y="32" text-anchor="end" font-family="Consolas, monospace" font-size="10" fill="#5A5A6E">07</text>
    <text x="48" y="48" font-size="17" font-weight="700" fill="#F5F4F8">setup + temp voice mode</text>
    <text x="30" y="88"  font-size="12.5" fill="#8A8AA0">bind to one channel or</text>
    <text x="30" y="110" font-size="12.5" fill="#8A8AA0">a whole category</text>
    <text x="320" y="176" text-anchor="end" font-family="Consolas, monospace" font-size="10" fill="#5EE7DF" fill-opacity=".85">/setup &#183; /temp-setup</text>
  </g>
  <g transform="translate(1184,434)">
    <rect width="348" height="200" rx="20" fill="#FFFFFF" fill-opacity=".03" stroke="#FFFFFF" stroke-opacity=".1"/>
    <circle cx="30" cy="42" r="4.5" fill="#FFB86B"/>
    <text x="320" y="32" text-anchor="end" font-family="Consolas, monospace" font-size="10" fill="#5A5A6E">08</text>
    <text x="48" y="48" font-size="17" font-weight="700" fill="#F5F4F8">self-healing voice</text>
    <text x="30" y="88"  font-size="12.5" fill="#8A8AA0">auto-joins and repairs</text>
    <text x="30" y="110" font-size="12.5" fill="#8A8AA0">broken connections</text>
    <text x="320" y="176" text-anchor="end" font-family="Consolas, monospace" font-size="10" fill="#FFB86B" fill-opacity=".85">/join &#183; /fix</text>
  </g>

  <!-- caption + stickers -->
  <text x="800" y="694" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#8A8AA0">live buttons on every track &#8212; skip &#183; loop &#183; fav &#183; volume</text>
  <g font-family="Consolas, monospace" font-size="9.5" text-anchor="middle">
    <g transform="translate(180,690) rotate(-7)">
      <rect x="-23" y="-10" width="46" height="20" rx="10" fill="#FFFFFF" fill-opacity=".04" stroke="#5EE7DF" stroke-opacity=".4"/>
      <text y="3.5" fill="#C9C9D6">trap</text>
    </g>
    <g transform="translate(1420,690) rotate(7)">
      <rect x="-23" y="-10" width="46" height="20" rx="10" fill="#FFFFFF" fill-opacity=".04" stroke="#FFB86B" stroke-opacity=".4"/>
      <text y="3.5" fill="#C9C9D6">jazz</text>
    </g>
  </g>

  <!-- footer -->
  <line x1="60" y1="752" x2="1540" y2="752" stroke="#FFFFFF" stroke-opacity=".12"/>
  <text x="60" y="776" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#8A8AA0">MEWZIK &#169; 2026</text>
  <circle cx="706" cy="772" r="3" fill="#5EE7DF"/>
  <text x="800" y="776" text-anchor="middle" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#8A8AA0">ONLINE &#8212; ALL SYSTEMS GO</text>
  <text x="1540" y="776" text-anchor="end" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#8A8AA0">MADE FOR DISCORD</text>
  <rect x="0" y="794" width="1600" height="6" fill="url(#blend)"/>
</svg>
