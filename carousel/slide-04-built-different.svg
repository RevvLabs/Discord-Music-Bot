<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">

  <!-- MEWZIK carousel · slide 04 / 05 · built different -->

  <defs>
    <linearGradient id="blend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EE7DF"/><stop offset=".38" stop-color="#6C5CE7"/>
      <stop offset=".68" stop-color="#FF6BCB"/><stop offset="1" stop-color="#FFB86B"/>
    </linearGradient>
    <radialGradient id="hazeCool"><stop offset="0" stop-color="#5EE7DF" stop-opacity=".16"/><stop offset="1" stop-color="#5EE7DF" stop-opacity="0"/></radialGradient>
    <radialGradient id="hazeWarm"><stop offset="0" stop-color="#FF8A65" stop-opacity=".16"/><stop offset="1" stop-color="#FF8A65" stop-opacity="0"/></radialGradient>
    <path id="spark" d="M0 -7 L1.8 -1.8 L7 0 L1.8 1.8 L0 7 L-1.8 1.8 L-7 0 L-1.8 -1.8 Z"/>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" opacity=".045"/>
    </pattern>
    <path id="tickX" d="M-4 -4 L4 4 M4 -4 L-4 4"/>
    <path id="tickOK" d="M-5 0 L-1.5 3.5 L5 -4"/>
  </defs>

  <!-- frame -->
  <rect width="1600" height="800" fill="#0B0B10"/>
  <ellipse cx="220"  cy="170" rx="420" ry="280" fill="url(#hazeCool)"/>
  <ellipse cx="1380" cy="170" rx="420" ry="280" fill="url(#hazeWarm)"/>
  <ellipse cx="220"  cy="650" rx="380" ry="240" fill="url(#hazeCool)" opacity=".6"/>
  <ellipse cx="1380" cy="650" rx="380" ry="240" fill="url(#hazeWarm)" opacity=".6"/>
  <rect x="60" y="48" width="1480" height="704" fill="url(#dots)"/>
  <text x="60"   y="36" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#8A8AA0">MEWZIK &#169; 2026</text>
  <text x="800"  y="36" text-anchor="middle" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#5A5A6E">04 / 05</text>
  <text x="1540" y="36" text-anchor="end" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#8A8AA0">DISCORD MUSIC BOT</text>
  <line x1="60" y1="48" x2="1540" y2="48" stroke="#FFFFFF" stroke-opacity=".12"/>

  <!-- header -->
  <text x="800" y="108" text-anchor="middle" font-family="Consolas, monospace" font-size="12" letter-spacing="4" fill="#5EE7DF">[ WHY US ]</text>
  <text x="800" y="156" text-anchor="middle" font-size="38" font-weight="700" fill="#F5F4F8">built different</text>
  <text x="800" y="186" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#8A8AA0">the stuff other music bots simply don&#8217;t have</text>
  <g font-family="Consolas, monospace" font-size="9.5" text-anchor="middle">
    <g transform="translate(420,140) rotate(-9)">
      <rect x="-26" y="-10" width="52" height="20" rx="10" fill="#FFFFFF" fill-opacity=".04" stroke="#FFB86B" stroke-opacity=".4"/>
      <text y="3.5" fill="#C9C9D6">drill</text>
    </g>
    <g transform="translate(1180,140) rotate(9)">
      <rect x="-26" y="-10" width="52" height="20" rx="10" fill="#FFFFFF" fill-opacity=".04" stroke="#5EE7DF" stroke-opacity=".4"/>
      <text y="3.5" fill="#C9C9D6">house</text>
    </g>
  </g>

  <!-- table -->
  <g>
    <line x1="60"   y1="220" x2="1540" y2="220" stroke="#FFFFFF" stroke-opacity=".12"/>
    <line x1="60"   y1="254" x2="1540" y2="254" stroke="#FFFFFF" stroke-opacity=".08"/>
    <line x1="1150" y1="220" x2="1150" y2="690" stroke="#FFFFFF" stroke-opacity=".06"/>
    <line x1="1340" y1="220" x2="1340" y2="690" stroke="#FFFFFF" stroke-opacity=".06"/>
    <line x1="60"   y1="690" x2="1540" y2="690" stroke="#FFFFFF" stroke-opacity=".12"/>

    <text x="120"  y="243" font-family="Consolas, monospace" font-size="10" letter-spacing="2" fill="#5A5A6E">FEATURE</text>
    <text x="1245" y="243" text-anchor="middle" font-family="Consolas, monospace" font-size="10" letter-spacing="2" fill="#5A5A6E">OTHERS</text>
    <text x="1440" y="243" text-anchor="middle" font-family="Consolas, monospace" font-size="10" letter-spacing="2" fill="url(#blend)" font-weight="700">MEWZIK</text>

    <g font-size="15" fill="#EDEDF2">
      <text x="120" y="291">lyrics that romanize non-latin songs</text>
      <text x="120" y="339">a voice connection that repairs itself</text>
      <text x="120" y="387">per-user audio engine choice</text>
      <text x="120" y="435">rendered profile cards + listening-time ranks</text>
      <text x="120" y="483">per-command dj locks, not one blunt role</text>
      <text x="120" y="531">autoplay that knows when the room is empty</text>
      <text x="120" y="579">two setup modes &#8212; channel or whole category</text>
      <text x="120" y="627">automatic sharding + clustering, scales itself</text>
      <text x="120" y="675">multi-bot fleet from a single codebase</text>
    </g>
    <g stroke="#FFFFFF" stroke-opacity=".05">
      <line x1="60" y1="306" x2="1540" y2="306"/>
      <line x1="60" y1="354" x2="1540" y2="354"/>
      <line x1="60" y1="402" x2="1540" y2="402"/>
      <line x1="60" y1="450" x2="1540" y2="450"/>
      <line x1="60" y1="498" x2="1540" y2="498"/>
      <line x1="60" y1="546" x2="1540" y2="546"/>
      <line x1="60" y1="594" x2="1540" y2="594"/>
      <line x1="60" y1="642" x2="1540" y2="642"/>
    </g>
    <g stroke="#5A5A6E" stroke-width="1.8" stroke-linecap="round" fill="none">
      <use href="#tickX" transform="translate(1245,286)"/>
      <use href="#tickX" transform="translate(1245,334)"/>
      <use href="#tickX" transform="translate(1245,382)"/>
      <use href="#tickX" transform="translate(1245,430)"/>
      <use href="#tickX" transform="translate(1245,478)"/>
      <use href="#tickX" transform="translate(1245,526)"/>
      <use href="#tickX" transform="translate(1245,574)"/>
      <use href="#tickX" transform="translate(1245,622)"/>
      <use href="#tickX" transform="translate(1245,670)"/>
    </g>
    <g stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <use href="#tickOK" transform="translate(1440,286)" stroke="#5EE7DF"/>
      <use href="#tickOK" transform="translate(1440,334)" stroke="#FFB86B"/>
      <use href="#tickOK" transform="translate(1440,382)" stroke="#5EE7DF"/>
      <use href="#tickOK" transform="translate(1440,430)" stroke="#FFB86B"/>
      <use href="#tickOK" transform="translate(1440,478)" stroke="#5EE7DF"/>
      <use href="#tickOK" transform="translate(1440,526)" stroke="#FFB86B"/>
      <use href="#tickOK" transform="translate(1440,574)" stroke="#5EE7DF"/>
      <use href="#tickOK" transform="translate(1440,622)" stroke="#FFB86B"/>
      <use href="#tickOK" transform="translate(1440,670)" stroke="#5EE7DF"/>
    </g>
  </g>
  <text x="800" y="722" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#8A8AA0">checked the competition so you don&#8217;t have to.</text>

  <!-- footer -->
  <line x1="60" y1="752" x2="1540" y2="752" stroke="#FFFFFF" stroke-opacity=".12"/>
  <text x="60" y="776" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#8A8AA0">MEWZIK &#169; 2026</text>
  <circle cx="706" cy="772" r="3" fill="#5EE7DF"/>
  <text x="800" y="776" text-anchor="middle" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#8A8AA0">ONLINE &#8212; ALL SYSTEMS GO</text>
  <text x="1540" y="776" text-anchor="end" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#8A8AA0">MADE FOR DISCORD</text>
  <rect x="0" y="794" width="1600" height="6" fill="url(#blend)"/>
</svg>
