<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">

  <!-- MEWZIK carousel · slide 01 / 05 · brand -->

  <defs>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EE7DF"/><stop offset="1" stop-color="#6C5CE7"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB86B"/><stop offset="1" stop-color="#FF6BCB"/>
    </linearGradient>
    <linearGradient id="blend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EE7DF"/><stop offset=".38" stop-color="#6C5CE7"/>
      <stop offset=".68" stop-color="#FF6BCB"/><stop offset="1" stop-color="#FFB86B"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EE7DF"/><stop offset=".5" stop-color="#6C5CE7"/><stop offset="1" stop-color="#FF8A65"/>
    </linearGradient>
    <radialGradient id="hazeCool"><stop offset="0" stop-color="#5EE7DF" stop-opacity=".16"/><stop offset="1" stop-color="#5EE7DF" stop-opacity="0"/></radialGradient>
    <radialGradient id="hazeWarm"><stop offset="0" stop-color="#FF8A65" stop-opacity=".16"/><stop offset="1" stop-color="#FF8A65" stop-opacity="0"/></radialGradient>
    <path id="spark" d="M0 -7 L1.8 -1.8 L7 0 L1.8 1.8 L0 7 L-1.8 1.8 L-7 0 L-1.8 -1.8 Z"/>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" opacity=".045"/>
    </pattern>
  </defs>

  <!-- frame -->
  <rect width="1600" height="800" fill="#0B0B10"/>
  <ellipse cx="220"  cy="170" rx="420" ry="280" fill="url(#hazeCool)"/>
  <ellipse cx="1380" cy="170" rx="420" ry="280" fill="url(#hazeWarm)"/>
  <ellipse cx="220"  cy="650" rx="380" ry="240" fill="url(#hazeCool)" opacity=".6"/>
  <ellipse cx="1380" cy="650" rx="380" ry="240" fill="url(#hazeWarm)" opacity=".6"/>
  <rect x="60" y="48" width="1480" height="704" fill="url(#dots)"/>
  <text x="60"   y="36" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#8A8AA0">MEWZIK &#169; 2026</text>
  <text x="800"  y="36" text-anchor="middle" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#5A5A6E">01 / 05</text>
  <text x="1540" y="36" text-anchor="end" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#8A8AA0">DISCORD MUSIC BOT</text>
  <line x1="60" y1="48" x2="1540" y2="48" stroke="#FFFFFF" stroke-opacity=".12"/>

  <!-- corner readouts -->
  <g font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#5A5A6E">
    <text x="84"   y="110">SRC x5</text>
    <text x="84"   y="128">FX x7</text>
    <text x="1516" y="110" text-anchor="end">MODE 24/7</text>
    <text x="1516" y="128" text-anchor="end">STATUS ONLINE</text>
  </g>

  <!-- orbital mark -->
  <g transform="translate(800,290)">
    <circle r="210" fill="none" stroke="#FFFFFF" stroke-opacity=".05"/>
    <circle r="155" fill="none" stroke="#FFFFFF" stroke-opacity=".05"/>
    <ellipse rx="230" ry="56" fill="none" stroke="url(#blend)" stroke-opacity=".3" stroke-width="1.4"/>
    <ellipse rx="175" ry="42" fill="none" stroke="url(#blend)" stroke-opacity=".8" stroke-width="1.8"/>
    <circle r="95" fill="url(#orb)"/>
    <ellipse cx="-20" cy="-44" rx="38" ry="20" fill="#FFFFFF" opacity=".18"/>
    <circle r="95" fill="none" stroke="#FFFFFF" stroke-opacity=".15"/>
    <circle cx="-230" cy="0" r="5" fill="#5EE7DF"/>
    <circle cx="230"  cy="0" r="5" fill="#FFB86B"/>
  </g>
  <g stroke="#FFFFFF" stroke-opacity=".25" stroke-width="1">
    <path d="M490 290h12M496 284v12"/>
    <path d="M1098 290h12M1104 284v12"/>
  </g>
  <use href="#spark" transform="translate(430,150)" fill="#5EE7DF"/>
  <use href="#spark" transform="translate(1170,150)" fill="#FFB86B"/>
  <use href="#spark" transform="translate(330,430) scale(.7)" fill="#6C5CE7"/>
  <use href="#spark" transform="translate(1270,430) scale(.7)" fill="#FF6BCB"/>

  <!-- genre stickers -->
  <g font-family="Consolas, monospace" font-size="9.5" text-anchor="middle">
    <g transform="translate(350,240) rotate(-10)">
      <rect x="-23" y="-10" width="46" height="20" rx="10" fill="#FFFFFF" fill-opacity=".04" stroke="#5EE7DF" stroke-opacity=".4"/>
      <text y="3.5" fill="#C9C9D6">lofi</text>
    </g>
    <g transform="translate(1250,240) rotate(10)">
      <rect x="-26" y="-10" width="52" height="20" rx="10" fill="#FFFFFF" fill-opacity=".04" stroke="#FFB86B" stroke-opacity=".4"/>
      <text y="3.5" fill="#C9C9D6">phonk</text>
    </g>
    <g transform="translate(420,500) rotate(-6)">
      <rect x="-22" y="-10" width="44" height="20" rx="10" fill="#FFFFFF" fill-opacity=".04" stroke="#FFB86B" stroke-opacity=".4"/>
      <text y="3.5" fill="#C9C9D6">r&amp;b</text>
    </g>
    <g transform="translate(1180,500) rotate(6)">
      <rect x="-22" y="-10" width="44" height="20" rx="10" fill="#FFFFFF" fill-opacity=".04" stroke="#5EE7DF" stroke-opacity=".4"/>
      <text y="3.5" fill="#C9C9D6">edm</text>
    </g>
    <g transform="translate(240,370) rotate(-8)">
      <rect x="-35" y="-10" width="70" height="20" rx="10" fill="#FFFFFF" fill-opacity=".04" stroke="#FFB86B" stroke-opacity=".4"/>
      <text y="3.5" fill="#C9C9D6">hyperpop</text>
    </g>
    <g transform="translate(1360,370) rotate(8)">
      <rect x="-26" y="-10" width="52" height="20" rx="10" fill="#FFFFFF" fill-opacity=".04" stroke="#5EE7DF" stroke-opacity=".4"/>
      <text y="3.5" fill="#C9C9D6">indie</text>
    </g>
  </g>

  <!-- wordmark -->
  <text x="800" y="560" text-anchor="middle" font-size="140" font-weight="800" letter-spacing="4" fill="url(#blend)">mewzik</text>
  <text x="800" y="614" text-anchor="middle" font-size="20" fill="#EDEDF2">your server&#8217;s new sound system.</text>
  <text x="800" y="650" text-anchor="middle" font-family="Consolas, monospace" font-size="11" letter-spacing="4" fill="#8A8AA0">MULTI-PLATFORM &#183; INTERACTIVE PLAYER &#183; ALWAYS ON</text>

  <g>
    <rect x="757" y="687" width="6" height="6" transform="rotate(45 760 690)" fill="#5EE7DF"/>
    <rect x="797" y="687" width="6" height="6" transform="rotate(45 800 690)" fill="#6C5CE7"/>
    <rect x="837" y="687" width="6" height="6" transform="rotate(45 840 690)" fill="#FFB86B"/>
  </g>

  <!-- footer -->
  <line x1="60" y1="752" x2="1540" y2="752" stroke="#FFFFFF" stroke-opacity=".12"/>
  <text x="60" y="776" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#8A8AA0">MEWZIK &#169; 2026</text>
  <circle cx="706" cy="772" r="3" fill="#5EE7DF"/>
  <text x="800" y="776" text-anchor="middle" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#8A8AA0">ONLINE &#8212; ALL SYSTEMS GO</text>
  <text x="1540" y="776" text-anchor="end" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#8A8AA0">MADE FOR DISCORD</text>
  <rect x="0" y="794" width="1600" height="6" fill="url(#blend)"/>
</svg>
