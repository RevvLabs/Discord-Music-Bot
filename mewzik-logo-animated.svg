<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">

  <!-- MEWZIK — animated bot logo / avatar mark -->

  <defs>
    <linearGradient id="orb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#5EE7DF"/>
      <stop offset=".5"  stop-color="#6C5CE7"/>
      <stop offset="1"   stop-color="#FF8A65"/>
    </linearGradient>
    <linearGradient id="blend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#5EE7DF"/>
      <stop offset=".38" stop-color="#6C5CE7"/>
      <stop offset=".68" stop-color="#FF6BCB"/>
      <stop offset="1"   stop-color="#FFB86B"/>
    </linearGradient>
    <radialGradient id="hazeCool"><stop offset="0" stop-color="#5EE7DF" stop-opacity=".18"/><stop offset="1" stop-color="#5EE7DF" stop-opacity="0"/></radialGradient>
    <radialGradient id="hazeWarm"><stop offset="0" stop-color="#FF8A65" stop-opacity=".18"/><stop offset="1" stop-color="#FF8A65" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbGlow"><stop offset="0" stop-color="#6C5CE7" stop-opacity=".45"/><stop offset="1" stop-color="#6C5CE7" stop-opacity="0"/></radialGradient>
    <!-- 3D sphere shading: lit upper-left, shadow lower-right -->
    <radialGradient id="sphereShade" cx="0.34" cy="0.28" r="0.95">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity=".40"/>
      <stop offset=".42" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".80" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"   stop-color="#000000" stop-opacity=".55"/>
    </radialGradient>
    <path id="spark" d="M0 -7 L1.8 -1.8 L7 0 L1.8 1.8 L0 7 L-1.8 1.8 L-7 0 L-1.8 -1.8 Z"/>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" opacity=".05"/>
    </pattern>

    <!-- orbital ellipse path the dots travel (matches the ring rx=350 ry=86) -->
    <path id="orbitPath" d="M -350 0 A 350 86 0 1 1 350 0 A 350 86 0 1 1 -350 0"/>
    <!-- larger satellite orbit -->
    <path id="satPath" d="M -332 0 A 332 332 0 1 1 332 0 A 332 332 0 1 1 -332 0"/>

    <style>
      /* ===== orb breathing glow ===== */
      .orbGlow   { animation: breathe 5.5s ease-in-out infinite; transform-origin: 512px 512px; }
      @keyframes breathe { 0%,100% { opacity:.85; transform: scale(1);    }
                           50%     { opacity:1;   transform: scale(1.06); } }

      /* ===== equalizer bars — staggered music pulse ===== */
      .bar { transform-box: fill-box; transform-origin: center; }
      .b1 { animation: eq 0.95s ease-in-out infinite;        }
      .b2 { animation: eq 0.72s ease-in-out infinite -0.20s; }
      .b3 { animation: eq 0.60s ease-in-out infinite -0.45s; }
      .b4 { animation: eq 0.80s ease-in-out infinite -0.10s; }
      .b5 { animation: eq 1.05s ease-in-out infinite -0.35s; }
      @keyframes eq { 0%,100% { transform: scaleY(0.45); }
                      50%     { transform: scaleY(1.18); } }

      /* ===== sparkles — twinkle + slow spin ===== */
      .spark { transform-box: fill-box; transform-origin: center; }
      .sp1 { animation: twinkle 2.6s ease-in-out infinite;        }
      .sp2 { animation: twinkle 3.1s ease-in-out infinite -0.8s;  }
      .sp3 { animation: twinkle 2.2s ease-in-out infinite -1.4s;  }
      .sp4 { animation: twinkle 3.6s ease-in-out infinite -2.0s;  }
      @keyframes twinkle { 0%,100% { opacity:.25; transform: scale(0.7) rotate(0deg);   }
                           50%     { opacity:1;   transform: scale(1.15) rotate(180deg); } }

      /* ===== haze drift ===== */
      .hazeA { animation: drift 9s ease-in-out infinite;       transform-origin: 250px 230px; }
      .hazeB { animation: drift 11s ease-in-out infinite -3s;  transform-origin: 780px 800px; }
      @keyframes drift { 0%,100% { transform: scale(1);   opacity:.9; }
                         50%     { transform: scale(1.1); opacity:1;  } }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" fill="#0B0B10"/>
  <ellipse class="hazeA" cx="250" cy="230" rx="420" ry="360" fill="url(#hazeCool)"/>
  <ellipse class="hazeB" cx="780" cy="800" rx="420" ry="360" fill="url(#hazeWarm)"/>
  <rect width="1024" height="1024" fill="url(#dots)"/>
  <circle class="orbGlow" cx="512" cy="512" r="440" fill="url(#orbGlow)"/>

  <!-- guide rings -->
  <circle cx="512" cy="512" r="468" fill="none" stroke="#FFFFFF" stroke-opacity=".05" stroke-width="2"/>
  <circle cx="512" cy="512" r="404" fill="none" stroke="#FFFFFF" stroke-opacity=".04" stroke-width="2"/>

  <g transform="translate(512,512)">
    <!-- ring: back arc (behind orb) -->
    <path d="M -350 0 A 350 86 0 0 1 350 0" fill="none" stroke="url(#blend)" stroke-opacity=".35" stroke-width="12" stroke-linecap="round"/>

    <!-- satellite note orbiting behind/over the orb on big circle -->
    <g>
      <circle r="11" fill="#FF6BCB">
        <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
          <mpath href="#satPath"/>
        </animateMotion>
        <animate attributeName="opacity" values=".4;1;.4" dur="7s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- BLUE BALL — back copy: visible only on far (top) half, drawn BEHIND orb -->
    <circle r="13" fill="#3FB8D8">
      <animateMotion dur="6s" repeatCount="indefinite" rotate="0">
        <mpath href="#orbitPath"/>
      </animateMotion>
      <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- orb (3D sphere) -->
    <circle r="280" fill="url(#orb)"/>
    <circle r="280" fill="url(#sphereShade)"/>
    <ellipse cx="-72" cy="-120" rx="96" ry="50" fill="#FFFFFF" opacity=".22"/>
    <circle r="280" fill="none" stroke="#FFFFFF" stroke-opacity=".15" stroke-width="3"/>

    <!-- equalizer bars -->
    <g fill="#FFFFFF" opacity=".95">
      <rect class="bar b1" x="-146" y="-45"  width="36" height="90"  rx="18"/>
      <rect class="bar b2" x="-82"  y="-75"  width="36" height="150" rx="18"/>
      <rect class="bar b3" x="-18"  y="-105" width="36" height="210" rx="18"/>
      <rect class="bar b4" x="46"   y="-75"  width="36" height="150" rx="18"/>
      <rect class="bar b5" x="110"  y="-45"  width="36" height="90"  rx="18"/>
    </g>

    <!-- ring: front arc (over orb) -->
    <path d="M -350 0 A 350 86 0 0 0 350 0" fill="none" stroke="url(#blend)" stroke-width="12" stroke-linecap="round"/>

    <!-- BLUE BALL — front copy: visible only on near (bottom) half, drawn OVER orb -->
    <circle r="16" fill="#5EE7DF">
      <animateMotion dur="6s" repeatCount="indefinite" rotate="0">
        <mpath href="#orbitPath"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- sparkles (outer <g> positions/scales; inner <use> animates so CSS transform doesn't clobber position) -->
  <g transform="translate(220,200) scale(2.4)"><use class="spark sp1" href="#spark" fill="#5EE7DF"/></g>
  <g transform="translate(806,200) scale(1.7)"><use class="spark sp2" href="#spark" fill="#FFB86B"/></g>
  <g transform="translate(212,820) scale(1.6)"><use class="spark sp3" href="#spark" fill="#FF6BCB"/></g>
  <g transform="translate(812,824) scale(2.2)"><use class="spark sp4" href="#spark" fill="#6C5CE7"/></g>
</svg>
